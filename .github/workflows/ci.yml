name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev --no-editable
      - run: uv run --no-sync agecon-literature --help
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/export_tool_catalog.py --check
      - run: uv run --no-sync python scripts/check_tool_skill_contract.py
      - run: uv run --no-sync python scripts/validate_skill.py
      - run: uv build
      - run: uv run --no-sync python scripts/check_distribution.py
